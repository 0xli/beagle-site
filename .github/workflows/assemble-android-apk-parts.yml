name: assemble-android-apk-parts

# Direct uploads of the ~70MB APK to uploads.github.com fail here with
# "tls: bad record MAC". Split the APK (`split -b 4m`), upload the parts,
# then run this workflow. It concatenates them, checks sha256, uploads the
# real APK, and deletes the parts.
#
# Site snapshot publishes wipe `.github/workflows`. The copy of this file
# that gets re-pushed lives at scripts/release/assemble-android-apk-parts.yml
# in the Android repo.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example android-v1.4.87
        required: true
        type: string
      final_name:
        description: Final APK asset name
        required: true
        type: string
      expected_sha256:
        description: sha256 of the assembled APK
        required: false
        type: string

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Assemble parts into the release APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FINAL_NAME: ${{ inputs.final_name }}
          EXPECTED: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p parts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.part*' --dir parts
          mapfile -t parts < <(find parts -type f -name '*.part*' | sort)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "no parts on $TAG" >&2
            exit 1
          fi
          cat "${parts[@]}" > "$FINAL_NAME"
          if [ -n "$EXPECTED" ]; then
            echo "$EXPECTED  $FINAL_NAME" | sha256sum -c -
          fi
          gh release upload "$TAG" "$FINAL_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          for p in "${parts[@]}"; do
            gh release delete-asset "$TAG" "$(basename "$p")" --repo "$GITHUB_REPOSITORY" --yes
          done
